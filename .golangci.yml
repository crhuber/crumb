version: "2"
run:
  go: "1.24"
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
  disable:
    - errcheck
  settings:
    gosec:
      excludes:
        - G404
        # Paths come from $HOME / --storage / --profile set by the user running
        # the CLI; no privilege boundary is crossed. Re-enable if paths ever
        # come from untrusted input (e.g. a server request or a cloned repo's config).
        - G703
    revive:
      rules:
        - name: exported
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: unused-parameter
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
